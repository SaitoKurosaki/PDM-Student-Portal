<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <meta
      name="description"
      content="Create a new account to access the Pambayang Dalubhasaan ng Marilao (PDM) student portal."
    />
    <link rel="stylesheet" href="../src/output.css" />
    <link rel="icon" type="image/png" href="/Pictures/pdm.png" />
    <meta
      property="og:title"
      content="Pambayang Dalubhasaan ng Marilao | PDM"
    />
    <meta
      property="og:description"
      content="student portal of Pambayang Dalubhasaan ng Marilao (PDM)."
    />
    <meta property="og:url" content="https://pdmmarilao.bond/" />
    <meta property="og:type" content="website" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Pambayang Dalubhasaan ng Marilao (PDM)",
        "alternateName": "PDM",
        "url": "https://pdmmarilao.bond/"
      }
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&family=DynaPuff:wght@400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap");
    </style>
  </head>
  <body class="bg-[#180E06] font-[Montserrat] text-white">
    <main class="flex justify-center items-center min-h-dvh">
      <form
        id="signupForm"
        class="border border-[#fda900]/40 rounded-xl p-5 w-[90%] max-w-md"
      >
        <div class="flex flex-col">
          <div
            class="flex flex-col justify-center items-center max-sm:py-0 max-sm:mb-5 py-5 gap-2 mb-2"
          >
            <img src="/Pictures/pdm.png" class="w-25" />
            <p
              class="flex w-full flex-col items-center text-center font-extrabold max-sm:text-base text-xl tracking-widest relative after:absolute after:h-1 after:w-1/2 after:bg-[#fda900] after:-bottom-2 after:rounded-lg"
            >
              PAMBAYANG DALUBHASAAN
              <span class="text-[#fda900]">NG MARILAO</span>
            </p>
          </div>
          <div class="text-center max-sm:mb-5 mb-10">
            <p class="text-2xl font-bold tracking-widest max-sm:text-lg">
              CREATE ACCOUNT
            </p>
            <p class="text-sm text-white/60 max-sm:text-xs">
              Please fill in the details to sign up
            </p>
          </div>
          <div class="flex flex-col gap-5">
            <div class="flex flex-col justify-start">
              <label class="mb-1 max-sm:text-sm">Full Name</label>
              <div
                class="flex border-[#fda900]/40 border rounded-md w-full p-2 gap-2"
              >
                <img src="/svg/user.svg" class="w-8 max-sm:w-6" />
                <input
                  placeholder="Enter Your Full Name"
                  name="full_name"
                  required
                  type="text"
                  class="w-full focus:outline-none focus:ring-0 text-base"
                />
              </div>
            </div>
            <div class="flex flex-col justify-start">
              <label class="mb-1 max-sm:text-sm">Email Address</label>
              <div
                class="flex border-[#fda900]/40 border rounded-md w-full p-2 gap-2"
              >
                <img src="/svg/email-2.svg" class="w-8 max-sm:w-6" />
                <input
                  placeholder="Enter Your Email"
                  name="email"
                  required
                  type="email"
                  class="w-full focus:outline-none focus:ring-0 text-base"
                />
              </div>
              <p id="emailError" class="text-red-400 text-sm mt-1"></p>
            </div>
            <div class="flex flex-col">
              <label class="mb-1 max-sm:text-sm">Password</label>
              <div
                class="flex justify-between border-[#fda900]/40 border rounded-md w-full p-2"
              >
                <div class="flex gap-2">
                  <img src="/svg/lock.svg" class="w-8 max-sm:w-6" />
                  <input
                    placeholder="Enter Your Password"
                    name="password"
                    type="password"
                    required
                    class="w-full focus:outline-none focus:ring-0 text-base"
                  />
                </div>
                <img
                  src="/svg/closedeye.svg"
                  class="showpass w-8 max-sm:w-6 cursor-pointer"
                />
              </div>
            </div>
          </div>
          <div class="text-center flex flex-col gap-2 mt-5">
            <button
              class="bg-[#fda900] p-2 rounded-md text-black font-bold max-sm:text-sm cursor-pointer"
            >
              SIGN UP
            </button>
            <div class="h-0.5 w-full bg-[#fda900]/20 my-5"></div>
            <p class="max-sm:text-sm">
              Already have an account?
              <a class="text-[#fda900] cursor-pointer" href="login.html"
                >Login</a
              >
            </p>
          </div>
        </div>
      </form>
    </main>
    <script src="/src/signup.js"></script>
  </body>
</html>
