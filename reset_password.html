<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <meta
      name="description"
      content="Reset your password and regain access to the Pambayang Dalubhasaan ng Marilao (PDM) student portal."
    />

    <link rel="stylesheet" href="/src/output.css" />
    <link rel="icon" type="image/png" href="/Pictures/pdm.png" />
    <meta
      property="og:title"
      content="Pambayang Dalubhasaan ng Marilao | PDM"
    />
    <meta
      property="og:description"
      content="student portal of Pambayang Dalubhasaan ng Marilao (PDM)."
    />
    <meta property="og:site_name" content="Pambayang Dalubhasaan ng Marilao" />
    <meta property="og:url" content="https://pdmmarilao.bond/" />
    <meta property="og:type" content="website" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Pambayang Dalubhasaan ng Marilao",
        "url": "https://pdmmarilao.bond/"
      }
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&family=DynaPuff:wght@400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap");
    </style>
  </head>
  <body class="bg-[#180E06] font-[Montserrat] text-white">
    <main class="flex justify-center items-center min-h-dvh">
      <form
        class="resetForm border border-[#fda900]/40 rounded-xl p-5 w-[90%] max-w-md"
      >
        <div class="flex flex-col">
          <div
            class="flex flex-col justify-center items-center max-sm:py-0 max-sm:mb-5 py-5 gap-2 mb-2"
          >
            <img src="/Pictures/pdm.png" class="w-25" />
            <p
              class="flex w-full flex-col items-center text-center font-extrabold max-sm:text-base text-xl tracking-widest relative after:absolute after:h-1 after:w-1/2 after:bg-[#fda900] after:-bottom-2 after:rounded-lg"
            >
              PAMBAYANG DALUBHASAAN
              <span class="text-[#fda900]">NG MARILAO</span>
            </p>
          </div>
          <div class="text-center max-sm:mb-5 mb-10">
            <p class="text-2xl font-bold tracking-widest max-sm:text-lg">
              RESET PASSWORD
            </p>
            <p class="text-sm text-[#ffffff9d] max-sm:text-xs">
              Enter your new password below.
            </p>
          </div>
          <div class="flex flex-col gap-5">
            <div class="flex flex-col">
              <label class="mb-1 max-sm:text-sm">Password</label>
              <div
                class="flex justify-between border-[#fda900]/40 border rounded-md w-full p-2"
              >
                <div class="flex gap-2">
                  <img src="/svg/lock.svg" class="w-8 max-sm:w-5" />
                  <input
                    placeholder="Enter your password"
                    name="password"
                    type="password"
                    required
                    class="inputpass w-full focus:outline-none focus:ring-0 text-base"
                  />
                </div>
                <img
                  src="/svg/closedeye.svg"
                  class="showpass w-8 max-sm:w-5 cursor-pointer"
                />
              </div>
            </div>
          </div>
          <p
            class="successstatus mt-4 rounded-md border border-green-500/30 bg-green-500/10 px-4 py-3 text-center text-sm text-green-400 hidden"
          >
            Password has been reset successfully. Your new credentials have been
            sent to your email.
          </p>
          <div class="text-center flex flex-col mt-5">
            <button
              class="bg-[#fda900] p-2 max-sm:text-sm rounded-md text-black font-bold cursor-pointer"
            >
              RESET PASSWORD
            </button>
            <div class="h-0.5 w-full bg-[#fda900]/20 my-5"></div>
            <p class="max-sm:text-sm">
              Remember your password?
              <a class="text-[#fda900] cursor-pointer" href="login.html"
                >Login</a
              >
            </p>
          </div>
        </div>
      </form>
    </main>
    <script src="/src/reset_password.js"></script>
  </body>
</html>
